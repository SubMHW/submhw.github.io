			<script>
				(function() {
					var tagContainer = d3.select('#tagFilters');
					var tableBody = d3.select('#citationTableBody');
					var countLabel = d3.select('#citationCount');
					var citations = [];
					var activeTag = 'All';

					function parseTags(tagField) {
						if (!tagField) {
							return [];
						}
						return tagField.split(';').map(function(tag) {
							return tag.trim();
						}).filter(Boolean);
					}

					function formatAuthors(authors) {
						if (!authors) {
							return 'Unknown';
						}
						return authors.split(';').map(function(name) {
							return name.trim();
						}).filter(Boolean).join(', ');
					}

					function formatTags(tags) {
						if (!tags.length) {
							return 'Uncategorized';
						}
						return tags.map(function(tag) {
							return tag.replace(/_/g, ' ');
						}).join(', ');
					}

					function getCitationUrl(row) {
						var url = row['Url'] ? row['Url'].trim() : '';
						var doi = row['DOI'] ? row['DOI'].trim() : '';
						if (!url && doi) {
							return 'https://doi.org/' + doi;
						}
						return url;
					}

					function updateFilters(tags) {
						var allTags = ['All'].concat(tags);
						var buttons = tagContainer.selectAll('a').data(allTags, function(d) { return d; });

						buttons.exit().remove();

						buttons.enter()
							.append('a')
							.attr('href', '#')
							.attr('class', 'button small')
							.text(function(d) { return d.replace(/_/g, ' '); })
							.on('click', function(event, d) {
								event.preventDefault();
								activeTag = d;
								applyFilters();
							});

						tagContainer.selectAll('a')
							.classed('special', function(d) { return d === activeTag; });
					}

					function applyFilters() {
						var filtered = activeTag === 'All'
							? citations
							: citations.filter(function(item) {
								return item.tags.indexOf(activeTag) !== -1;
							});

						updateRows(filtered);
						countLabel.text(filtered.length + ' citation' + (filtered.length === 1 ? '' : 's') + ' shown');
						updateFilters(getUniqueTags(citations));
					}

					function updateRows(rows) {
						var items = tableBody.selectAll('tr').data(rows, function(d) { return d.key; });
						items.exit().remove();

						var enter = items.enter().append('tr');
						enter.append('td').attr('class', 'citation-title');
						enter.append('td').attr('class', 'citation-authors');
						enter.append('td').attr('class', 'citation-source');
						enter.append('td').attr('class', 'citation-year');
						enter.append('td').attr('class', 'citation-tags');

						items = enter.merge(items);

						items.select('.citation-title').each(function(d) {
							var cell = d3.select(this);
							cell.selectAll('*').remove();
							if (d.url) {
								cell.append('a')
									.attr('href', d.url)
									.attr('target', '_blank')
									.attr('rel', 'noopener')
									.text(d.title);
							} else {
								cell.text(d.title);
							}
						});
						items.select('.citation-authors').text(function(d) { return d.authors; });
						items.select('.citation-source').text(function(d) { return d.source || '—'; });
						items.select('.citation-year').text(function(d) { return d.year || '—'; });
						items.select('.citation-tags').text(function(d) { return formatTags(d.tags); });
					}

					function getUniqueTags(list) {
						var tagSet = {};
						list.forEach(function(item) {
							item.tags.forEach(function(tag) {
								tagSet[tag] = true;
							});
						});
						return Object.keys(tagSet).sort(function(a, b) {
							return a.localeCompare(b);
						});
					}

					function loadCitations() {
						d3.csv('assets/files/SubMHWs_zotero.csv').then(function(data) {
							citations = data.map(function(row) {
								return {
									key: row.Key || (row.Title + row.Author),
									title: row.Title ? row.Title.trim() : '',
									authors: formatAuthors(row.Author),
									source: row['Publication Title'] ? row['Publication Title'].trim() : '',
									year: row['Publication Year'] ? row['Publication Year'].trim() : '',
									tags: parseTags(row['Manual Tags']),
									url: getCitationUrl(row)
								};
							}).filter(function(item) {
								return item.title;
							});

							updateFilters(getUniqueTags(citations));
							applyFilters();
						});
					}

					loadCitations();
				})();
			</script>
			<script>
				(function() {
					var container = document.getElementById('map');
					var tooltip = document.getElementById('mapTooltip');
					var svg = d3.select(container).append('svg');
					var mapData = null;
					var zoom = d3.zoom()
						.scaleExtent([1, 6])
						.on('zoom', function(event) {
							svg.select('g.map-layer').attr('transform', event.transform);
						});

					var sites = [
						{ name: 'North Atlantic', coords: [-35, 48], note: 'Wintertime subsurface intensification.' },
						{ name: 'Equatorial Pacific', coords: [-130, 0], note: 'Waveguide for anomaly propagation.' },
						{ name: 'Southern Ocean', coords: [20, -55], note: 'Deep heat storage hotspots.' },
						{ name: 'Western Pacific', coords: [150, 20], note: 'Boundary current influences.' },
						{ name: 'Indian Ocean', coords: [80, -15], note: 'Persistent subsurface anomalies.' }
					];

					function setMapHeight(width) {
						var height = Math.max(360, Math.round(width * 0.55));
						container.style.height = height + 'px';
						return height;
					}

					function renderMap(world) {
						var width = container.clientWidth;
						var height = setMapHeight(width);
						svg.attr('viewBox', '0 0 ' + width + ' ' + height)
							.attr('preserveAspectRatio', 'xMidYMid meet');
						svg.selectAll('*').remove();

						var projection = d3.geoNaturalEarth1().fitSize([width, height], { type: 'Sphere' });
						var path = d3.geoPath(projection);
						var graticule = d3.geoGraticule10();
						var countries = topojson.feature(world, world.objects.countries).features;

						var layer = svg.append('g').attr('class', 'map-layer');
						layer.append('path')
							.datum({ type: 'Sphere' })
							.attr('class', 'sphere')
							.attr('d', path);

						layer.append('path')
							.datum(graticule)
							.attr('class', 'graticule')
							.attr('d', path);

						layer.append('g')
							.selectAll('path')
							.data(countries)
							.enter()
							.append('path')
							.attr('class', 'country')
							.attr('d', path);

						var siteGroup = layer.append('g');
						siteGroup.selectAll('circle')
							.data(sites)
							.enter()
							.append('circle')
							.attr('class', 'site')
							.attr('r', 6)
							.attr('transform', function(d) {
								var projected = projection(d.coords);
								return 'translate(' + projected[0] + ',' + projected[1] + ')';
							})
							.on('mouseenter', function(event, d) {
								d3.selectAll('.site').classed('highlight', false);
								d3.select(this).classed('highlight', true);
								tooltip.innerHTML = '<strong>' + d.name + '</strong><br />' + d.note;
								tooltip.style.opacity = 1;
							})
							.on('mousemove', function(event) {
								var bounds = container.getBoundingClientRect();
								tooltip.style.left = (event.clientX - bounds.left) + 'px';
								tooltip.style.top = (event.clientY - bounds.top) + 'px';
							})
							.on('mouseleave', function() {
								d3.select(this).classed('highlight', false);
								tooltip.style.opacity = 0;
							});

						svg.call(zoom);
					}

					function loadMap() {
						return d3.json('https://cdn.jsdelivr.net/npm/world-atlas@2/countries-110m.json')
							.then(function(world) {
								mapData = world;
								renderMap(world);
							});
					}

					document.getElementById('mapReset').addEventListener('click', function(event) {
						event.preventDefault();
						svg.transition().duration(600).call(zoom.transform, d3.zoomIdentity);
					});

					window.addEventListener('resize', function() {
						if (mapData) {
							renderMap(mapData);
						}
					});

					loadMap();
				})();
			</script>
